apis:
- name: Litecoin Space WebSocket API
  description: >-
    A real-time WebSocket API provided by Litecoin Space (litecoinspace.org) for subscribing to live Litecoin
    network events. Clients connect to the WebSocket endpoint and subscribe to channels including new
    blocks, mempool block projections, live 2-hour fee rate charts, and network stats. Address tracking
    is supported to receive push notifications for new mempool and block-confirmed transactions involving
    a specific address.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://litecoinspace.org/docs/api/websocket
  baseURL: wss://litecoinspace.org/api/v1/ws
  tags:
  - WebSocket
  - Block Explorer
  - Litecoin Space
  - Real-Time
  - Blocks
  - Mempool
  - Address Tracking
  - Fees

openapi: 3.2.0
info:
  title: Litecoin Core REST Blockchain API
  description: 'An unauthenticated, read-only HTTP REST interface built into Litecoin Core, enabled with the -rest flag. Supports retrieval of transactions, full blocks, block headers, block hash by height, chain information, UTXO set queries (per BIP64), and mempool statistics and contents. Responses are available in binary, hex-encoded, or JSON format depending on the file extension (.bin, .hex, .json) appended to each path. Runs on the same port as JSON-RPC (default 9332 mainnet). No authentication required.

    '
  version: '0.21'
  contact:
    name: Litecoin Project
    url: https://github.com/litecoin-project/litecoin
  license:
    name: MIT
    url: https://github.com/litecoin-project/litecoin/blob/master/COPYING
servers:
- url: http://localhost:9332
  description: Litecoin Core mainnet (start with -rest flag)
- url: http://localhost:19332
  description: Litecoin Core testnet
- url: http://localhost:19443
  description: Litecoin Core regtest
tags:
- name: Blockchain
  description: Chain state information endpoints
paths:
  /rest/chaininfo.json:
    get:
      operationId: getChainInfo
      summary: Get chain info
      description: 'Returns various state information regarding block chain processing. Only available in JSON format. Equivalent to the getblockchaininfo JSON-RPC call.

        '
      responses:
        '200':
          description: Chain state information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainInfo'
      tags:
      - Blockchain
components:
  schemas:
    ChainInfo:
      type: object
      properties:
        chain:
          type: string
          description: Current network (main, test, regtest)
        blocks:
          type: integer
          description: Current number of blocks processed in the server
        headers:
          type: integer
          description: Current number of headers known
        bestblockhash:
          type: string
          description: Hash of the currently best block
        difficulty:
          type: number
        mediantime:
          type: integer
        verificationprogress:
          type: number
        chainwork:
          type: string
        size_on_disk:
          type: integer
        pruned:
          type: boolean
        pruneheight:
          type: integer
        softforks:
          type: object
externalDocs:
  description: Litecoin Core REST Interface Documentation
  url: https://github.com/litecoin-project/litecoin/blob/master/doc/REST-interface.md
